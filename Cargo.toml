[package]
name = "btcfuse"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoincore-rpc = "0.18"
bitcoin = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libc = "0.2"
governor = "0.6"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
moka = { version = "0.12", features = ["sync"] }
sled = "0.34"
bincode = "1"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tempfile = "3"

[lints.clippy]
pedantic = "warn"
