name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Uncomment when switching to GitHub-hosted runner
      # - name: Install Rust
      #   uses: dtolnay/rust-toolchain@stable
      #   with:
      #     components: clippy, rustfmt
      # - name: Cache
      #   uses: Swatinem/rust-cache@v2

      - name: Install FUSE system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfuse3-dev

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
